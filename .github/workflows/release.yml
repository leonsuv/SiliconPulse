name: Build and release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent SiliconPulse.app SiliconPulse.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: SiliconPulse.zip
